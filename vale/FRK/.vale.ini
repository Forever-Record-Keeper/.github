# The FRK Vale package: the shared prose rules for all Forever Record Keeper repos.
# vale/CALIBRATION.md records every change to a rule from another package, with its reason.

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-experimental.zip

# Global, not under [*]: only a global Vocab feeds the exception lists of rules such as FRK.HeadingCase.
Vocab = FRK

[*.md]
BasedOnStyles = Vale, ai-tells, FRK

# FRK.Spelling replaces the built-in check with a strict en_US dictionary.
Vale.Spelling = NO

# 2 rules from the experimental package. The rest of that package stays off.
ai-tells-experimental.PassiveVoice = YES
ai-tells-experimental.PassiveVoiceAdverb = YES

# Calibration of 2026-11-23. The reasons are in vale/CALIBRATION.md.
# Off: the rule conflicts with the FRK rules, or an FRK rule replaces it.
ai-tells.ColonUsage = NO
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO
ai-tells.FormalTransitions = NO
ai-tells.NegatedObject = NO
ai-tells.ParallelStaccato = NO
# Down: the rule also matches literal or plain phrases that recur in our texts.
ai-tells.VerbTricolon = suggestion
ai-tells.AnnouncementHeadings = warning
ai-tells.AnthropomorphicCognition = warning
ai-tells.ContrastiveNegation = warning
ai-tells.ExplainerHeadings = warning
ai-tells.FigurativeKeeps = warning
ai-tells.HedgingPhrases = warning
ai-tells.NegatedSubject = warning
ai-tells.RestatementMarkers = warning
ai-tells.UniversalSubject = warning
